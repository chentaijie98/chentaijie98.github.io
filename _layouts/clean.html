<!doctype html>
<html lang="{{ site.locale | default: 'en' }}" data-theme="light">
  <head>
    {% include base_path %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="HandheldFriendly" content="True">

    {% include seo.html %}
    <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

    {% include head/icons.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.min.css">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/site.css">

    <noscript><style>.reveal { opacity: 1; transform: none; }</style></noscript>

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="site">
    <a class="skip-link" href="#content">Skip to content</a>

    {% include site-nav.html %}

    <main id="content" class="site-main">
      {{ content }}
    </main>

    {% include site-footer.html %}

    <script>
      (function () {
        var nav = document.querySelector('.site-nav');
        var toggle = nav && nav.querySelector('.site-nav__toggle');
        if (toggle) {
          toggle.addEventListener('click', function () {
            nav.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', nav.classList.contains('is-open'));
          });
        }

        var themeBtn = document.querySelector('.theme-toggle');
        if (themeBtn) {
          themeBtn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
          });
        }

        var targets = document.querySelectorAll('.reveal');
        if (!('IntersectionObserver' in window)) {
          Array.prototype.forEach.call(targets, function (el) { el.classList.add('is-visible'); });
          return;
        }
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
        Array.prototype.forEach.call(targets, function (el) { io.observe(el); });
      })();
    </script>

    {% if page.clustrmaps %}
      <script type="text/javascript" id="clustrmaps" src="//clustrmaps.com/map_v2.js?d=2Fn4m2hY1SgpaARN_eQNld7R4iIDB0cu_F-vPYzASgg&cl=ffffff&t=tt&w=240"></script>
    {% endif %}
  </body>
</html>
